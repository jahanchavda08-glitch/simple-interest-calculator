<!DOCTYPE html>
<html>
<head>
    <title>Simple Interest Calculator</title>
</head>
<body>

    <h2>Simple Interest Calculator</h2>

    <label>Principal Amount:</label>
    <input type="number" id="principal"><br><br>

    <label>Rate of Interest (% per year):</label>
    <input type="number" id="rate"><br><br>

    <label>Time (in years):</label>
    <input type="number" id="time"><br><br>

    <button onclick="calculateInterest()">Calculate</button>

    <h3 id="result"></h3>

    <script>
        function calculateInterest() {
            var p = document.getElementById("principal").value;
            var r = document.getElementById("rate").value;
            var t = document.getElementById("time").value;

            var simpleInterest = (p * r * t) / 100;

            document.getElementById("result").innerHTML =
                "Simple Interest is: " + simpleInterest;
        }
    </script>

</body>
</html>
